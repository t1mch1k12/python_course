<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Авторизация</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #fff; font: 16px Arial, sans-serif; }
    main { width: min(390px, 92vw); padding: 28px; background: #151e30; border-radius: 12px; }
    h1 { font-size: 24px; text-align: center; }
    label { display: block; margin: 16px 0 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #354466; border-radius: 6px; background: #101827; color: white; }
    button { width: 100%; padding: 12px; margin-top: 20px; border: 0; border-radius: 6px; background: #4258bc; color: white; cursor: pointer; }
    .error { padding: 12px; border: 1px solid #a12b42; border-radius: 6px; background: #381923; color: #ff8796; }
  </style>
</head>
<body>
  <main>
    <h1>Вход в систему</h1>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form action="{{ url_for('login') }}" method="POST">
      <label for="username">Имя пользователя</label>
      <input id="username" name="username" type="text" value="{{ username | default('') }}" autocomplete="username" required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
